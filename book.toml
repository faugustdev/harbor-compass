[book]
title = "Harbor Compass"
authors = ["faugustdev"]
language = "es"
multilingual = false
src = "docs-src"
description = "Documentación interna"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/faugustdev/harbor-compass"
edit-url-template = "https://github.com/faugustdev/harbor-compass/edit/main/{path}"
site-url = "/harbor-compass/"
no-section-label = false

[output.html.fold]
enable = true
level = 1

[output.html.playground]
editable = false

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[preprocessor.index]

[preprocessor.links]